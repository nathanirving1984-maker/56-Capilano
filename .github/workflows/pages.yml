name: Deploy to GitHub Pages

# The site is plain static files at the repository root — nothing to build.
# This workflow just packages the repo and hands it to Pages.

on:
  push:
    branches:
      - main
      - claude/capilano-listing-site-2fc6um
  workflow_dispatch:

# Required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Turn Pages on (with Actions as the source) if it isn't already,
          # so no manual step in Settings is needed.
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # Whole repo root. The action excludes .git and .github itself.
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
